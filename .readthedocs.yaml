version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# protea-sources is a Poetry project: the docs toolchain lives in the
# optional ``docs`` group, not a PEP 621 ``[docs]`` extra, so there is no
# ``extra_requirements: [docs]`` to install. The docs dependencies (the
# Sphinx extensions and theme referenced in docs/source/conf.py) are pinned
# in docs/requirements.txt and installed before the package itself.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
