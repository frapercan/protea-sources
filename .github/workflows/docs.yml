name: docs

on:
  push:
    branches: [develop, master, main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pipx install poetry
      - name: Install package + docs dependencies
        run: poetry install --with docs
      - name: Build HTML (warnings are errors)
        run: poetry run sphinx-build -b html -W --keep-going docs/source docs/build/html
      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/build/html
