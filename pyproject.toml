[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "protea-sources"
version = "0.0.1"
description = "Annotation source plugins for the PROTEA stack: GOA, QuickGO, UniProt, future InterProScan."
authors = ["Francisco Miguel Pérez Canales <frapercan1@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "protea_sources", from = "src" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
"protea-contracts" = { git = "https://github.com/frapercan/protea-contracts.git", branch = "develop" }
requests = ">=2.31"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.1"
mypy = ">=1.7"
types-requests = ">=2.31"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.3"
shibuya = ">=2024.10"
sphinx-copybutton = ">=0.5"
sphinx-design = ">=0.5"

# Plugin discovery: protea-core resolves AnnotationSource implementations
# via entry_points on this group. Adding a new source = a new sub-module
# here + an entry registered below + protea-core picks it up at startup.
[tool.poetry.plugins."protea.sources"]
goa = "protea_sources.goa:plugin"
quickgo = "protea_sources.quickgo:plugin"
uniprot = "protea_sources.uniprot:plugin"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
# numpy / pandas generic types add ``Any, Any`` bloat; tighten when
# the upstream stubs stabilise.
disallow_any_generics = false

[[tool.mypy.overrides]]
# Tests use **kwargs unpacking, untyped fixture functions, and tuple
# literals freely; strict typing on tests adds ceremony without
# catching real bugs in the source code (which remains strict above).
# Mirrors PROTEA's per-module ignore for routers / operations.
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
